.rchip{display:flex;align-items:center;gap:6px;min-height:36px;padding:2px 12px 2px 5px;border:1.5px solid var(--line);border-radius:999px;background:transparent;font-weight:600;cursor:pointer;opacity:.6}
.rchip.on{opacity:1;border-color:var(--c);background:var(--cell);box-shadow:0 0 10px var(--c)}
.rchip .tk{width:24px;font-size:12px;border:0}
.rcash{font-size:14px;color:var(--mute)}.rcash b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.rcards{display:grid;grid-template-columns:1fr;gap:10px}
.dc{background:var(--cell);border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.dc.mortg{opacity:.6}
.dc .dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.65)}
.dc .dt{font-family:var(--f-disp);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:21px;line-height:1.05;min-width:0}
.dc .dpz{font-family:var(--f-mono);font-weight:600;font-size:13px;flex:none}
.dc .dk2{padding:0 10px;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.dc .dl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 10px;font-size:14px}
.dc .dl b{font-family:var(--f-mono);font-weight:600}
.dc .hp{display:flex;align-items:center;gap:3px}
.hs{width:10px;height:10px;background:var(--good);border-radius:2px}
.dc .tagm{margin:0 10px;align-self:flex-start;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:3px;background:var(--good);color:#fff}
.dc .tagm.mt{background:var(--warn)}
.dc .dbt{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px}
@media (max-width:879px){.rail{position:static;transform:none;visibility:visible;width:auto;max-height:none;box-shadow:none;border:1px solid var(--line);border-radius:10px;padding:12px;z-index:1}.rail.open.anim{animation:none}.rail-bg,.peek,.rclose{display:none!important}.layout{display:flex;flex-direction:column;gap:12px}}
@media (min-width:880px){
  #app{max-width:1000px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
  .rail{position:sticky;top:12px;transform:none;visibility:visible;width:auto;max-height:calc(100vh - 24px);border:1px solid var(--line);border-radius:10px;box-shadow:none;padding:14px;z-index:1}
  .rail-bg,.peek,.rclose{display:none}
}
@media (prefers-reduced-motion:reduce){.btn.pulse{animation:none}.deed.long,.rail.open.anim{animation:none!important}.deed,.deed .stamp,.deed .rv,.cf{animation:none!important}.dice.rolling .die{animation:none!important}.pw.act span{animation:none}}

if(!uid){uid='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{sessionStorage.setItem('av-uid',uid);}catch(e){}}
function snap(id,d){return {id:id,exists:d!=null,data:function(){return d==null?undefined:d;},metadata:{}};}
function send(m){if(ws&&ws.readyState===1)ws.send(JSON.stringify(m));}
function fire(c,ch){var a=Object.keys(c.cache).map(function(id){return snap(id,c.cache[id]);});c.cbs.forEach(function(cb){cb({docs:a,size:a.length,empty:!a.length,docChanges:function(){return ch;},metadata:{}});});}
function onMsg(e){
  var m,c;try{m=JSON.parse(e.data);}catch(x){return;}
  if(m.t==='doc'){(docs[m.path]||[]).slice().forEach(function(cb){cb(snap(m.path.split('/').pop(),m.data));});}
  else if(m.t==='col'){c=cols[m.path];if(!c)return;var old=c.cache,nw={},ch=[];m.docs.forEach(function(d){nw[d.id]=d.data;});
    Object.keys(nw).forEach(function(id){if(!(id in old))ch.push({type:'added',doc:snap(id,nw[id])});else if(JSON.stringify(old[id])!==JSON.stringify(nw[id]))ch.push({type:'modified',doc:snap(id,nw[id])});});
    Object.keys(old).forEach(function(id){if(!(id in nw))ch.push({type:'removed',doc:snap(id,old[id])});});
    c.cache=nw;fire(c,ch);}
  else if(m.t==='chg'){c=cols[m.col];if(!c)return;var had=m.id in c.cache,ty;
    if(m.data==null){delete c.cache[m.id];ty='removed';}else{c.cache[m.id]=m.data;ty=had?'modified':'added';}
    fire(c,[{type:ty,doc:snap(m.id,m.data)}]);}
  else if(m.t==='msg'){(msgH[m.topic]||[]).slice().forEach(function(f){try{f({topic:m.topic,data:m.data,isMe:false,peer:m.peer});}catch(x){}});}
  else if(m.t==='peers'){peersL=m.peers||[];}
}
function connect(){return new Promise(function(res,rej){
  var done=false;ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=function(){done=true;send({t:'hello'});Object.keys(subs).forEach(function(k){send(subs[k]);});if(pres)send({t:'pres',data:pres});res();};
  ws.onmessage=onMsg;
  ws.onerror=function(){if(!done)rej(new Error('ws'));};
  ws.onclose=function(){if(!done){rej(new Error('ws'));return;}setTimeout(relink,2000);};
});}
function relink(){connect().catch(function(){setTimeout(relink,2000);});}
function connectOnce(){
  if(!ready){ready=(async function(){for(var i=0;i<8;i++){try{await connect();return;}catch(e){await new Promise(function(r){setTimeout(r,4000);});}}throw new Error('x');})();ready.catch(function(){ready=null;});}
  return ready;
}
setInterval(function(){send({t:'ping'});},25000);
var db={
  doc:function(p){return {
    set:function(d){send({t:'set',path:p,data:d});return Promise.resolve();},
    delete:function(){send({t:'del',path:p});return Promise.resolve();},
    onSnapshot:function(cb){(docs[p]=docs[p]||[]).push(cb);var m={t:'subdoc',path:p};subs['d:'+p]=m;send(m);return function(){docs[p]=(docs[p]||[]).filter(function(x){return x!==cb;});};}
  };},
  collection:function(p){return {onSnapshot:function(cb){
    var c=cols[p]=cols[p]||{cache:{},cbs:[]};c.cbs.push(cb);var m={t:'subcol',path:p};subs['c:'+p]=m;send(m);
    return function(){c.cbs=c.cbs.filter(function(x){return x!==cb;});};
  }};}
};
var room={
  emit:function(t,d){send({t:'emit',topic:t,data:d});return Promise.resolve();},
  on:function(t,f){(msgH[t]=msgH[t]||[]).push(f);return function(){msgH[t]=(msgH[t]||[]).filter(function(x){return x!==f;});};},
  presence:function(p){pres=p;send({t:'pres',data:p});return Promise.resolve();},
  peers:function(){return peersL;}
};
var user={id:function(){return Promise.resolve(uid);}};
window.claude={use:function(n){return connectOnce().then(function(){return n==='db'?db:(n==='user'?user:(n==='room'?room:null));});}};
})();

    var d=noiseBuf.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;

function tone(f,t0,dur,type,vol,f2){

  var t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.03);

function tick(t0,vol,freq){
  var a=ac();if(!a||!noiseBuf)return;
  var t=a.currentTime+t0,src=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();

  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);

    cf+='<i class="cf '+(kind==='loss'?'bill':'coin')+'" style="--c:'+(kind==='loss'?'#c0392b':'#f2c21b')+';--dx:'+dx+'px;--dy:'+dy+'px;--r:'+Math.round(Math.random()*360)+'deg"></i>';
  }
  var ks=rows.length>1?[rows[0].k,rows[1].k]:[rows[0].k];
  var rh=rows.length>1?rows.map(function(r){
    var q=G.pl[r.k];if(!q)return '';
    return '<div class="dp"><span>'+esc(q.name)+'</span><b class="'+(r.a>=0?'pos':'neg')+'">'+(r.a>=0?'+':'−')+Math.abs(r.a)+' lei</b></div>';
  }).join(''):'';
  var bx=popOpen('<div class="popwrap"><div class="deed">'+whoHTML(ks)+'<div class="db" style="background:'+band+'"></div><div class="dk">'+esc(title)+'</div><div class="rv '+kind+'" id="rv">'+sign+amt+' lei</div>'+(name?'<div class="dn" style="font-size:30px">'+esc(name)+'</div>':'')+rh+'</div>'+cf+'</div>',kind==='loss'?[40,30,40]:[20,30,20,30,40]);
  var el=bx&&bx.querySelector('#rv');
  if(el&&typeof setInterval==='function'){
    var n=0,steps=14,iv=setInterval(function(){n++;el.textContent=sign+Math.round(amt*Math.min(1,n/steps))+' lei';if(n>=steps)clearInterval(iv);},34);
  }
}
function landMs(){return (lastRoll&&Date.now()-lastRoll<400)?Math.round(ld*1000):0;}
function moneyPop(kind,title,name,amt,rows,ms){
  if(!G)return;
  if(ms<0){showMoney(kind,title,name,amt,rows);return;}
  schedulePop(ms||0,function(){showMoney(kind,title,name,amt,rows);});
}
function rentPop(i,from,to,amt){
  moneyPop('move','Chirie',T[i].n,amt,[{k:from,a:-amt},{k:to,a:amt}],landMs());
}
function setDie(el,n){
  var is=el.children;
  for(var k=0;k<9;k++)is[k].className=PIPS[n].indexOf(k)>=0?'on':'';
}
function rollAnim(fin){
  if(typeof setInterval!=='function'||!app.querySelectorAll)return;
  if(rt){clearInterval(rt);rt=null;}
  var n=0,msg=app.querySelector('.msg');
  if(msg)msg.classList.add('hold');
  try{if(navigator.vibrate)navigator.vibrate([12,50,28]);}catch(e){}
  rt=setInterval(function(){
    var box=app.querySelector('.dice.rolling'),ds=app.querySelectorAll('.die');
    n++;
    if(!box||n>=11){
      clearInterval(rt);rt=null;
      if(box&&ds.length>1){setDie(ds[0],fin[0]);setDie(ds[1],fin[1]);}
      setTimeout(function(){var m=app.querySelector('.msg');if(m)m.classList.remove('hold');},Math.max(0,busyUntil-Date.now()-400));
      return;
    }
    ds.forEach(function(d){setDie(d,1+Math.floor(Math.random()*6));});
  },68);
}

var railOpen=false,railPl=null,railWas=false,railAnim=false,CARDMS=3200;
var setup={n:2,t:['h','h','ai','ai','ai','ai'],names:['Ana','Radu','Maria','Ioana','Dan','Elena']};

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function rd(){return 1+Math.floor(Math.random()*6);}
function cp(){return G.pl[G.cur];}
function logm(s){G.log.unshift(s);if(G.log.length>40)G.log.pop();}
function owned(pi){return Object.keys(G.pr).map(Number).filter(function(i){return G.pr[i].o===pi;}).sort(function(a,b){return a-b;});}
function grp(g){var r=[];for(var i=0;i<T.length;i++)if(T[i].g===g)r.push(i);return r;}
function hasSet(pi,g){return grp(g).every(function(i){return G.pr[i]&&G.pr[i].o===pi;});}
function countOwned(pi,type){return owned(pi).filter(function(i){return T[i].t===type;}).length;}

function rentOf(i){
  var t=T[i],s=G.pr[i];
  if(t.t==='p'){
    if(s.h>0)return t.r[s.h];
    return hasSet(s.o,t.g)?t.r[0]*2:t.r[0];
  }
  if(t.t==='st')return 25*Math.pow(2,countOwned(s.o,'st')-1);
  var n=countOwned(s.o,'ut');
  return (G.dice[0]+G.dice[1])*(n===2?10:4);
}

/* ---------- construcții, ipoteci ---------- */
function minH(g){return Math.min.apply(null,grp(g).map(function(i){return G.pr[i]?G.pr[i].h:0;}));}
function maxH(g){return Math.max.apply(null,grp(g).map(function(i){return G.pr[i]?G.pr[i].h:0;}));}
function canBuild(i){
  var t=T[i],s=G.pr[i],p=cp();
  if(!s||s.o!==G.cur||t.t!=='p'||!hasSet(G.cur,t.g))return false;
  if(grp(t.g).some(function(j){return G.pr[j].m;}))return false;
  return s.h<5&&s.h===minH(t.g)&&p.cash>=t.h;
}
function canSell(i){
  var t=T[i],s=G.pr[i];
  return !!(s&&s.o===G.cur&&t.t==='p'&&s.h>0&&s.h===maxH(t.g));
}
function canMort(i){
  var t=T[i],s=G.pr[i];
  if(!s||s.o!==G.cur||s.m)return false;
  if(t.t==='p')return grp(t.g).every(function(j){return !G.pr[j]||G.pr[j].h===0;});
  return true;
}
function unCost(i){return Math.ceil(T[i].p/2*1.1);}
function canUnmort(i){var s=G.pr[i];return !!(s&&s.o===G.cur&&s.m&&cp().cash>=unCost(i));}
function doBuild(i){if(!canBuild(i))return;cp().cash-=T[i].h;G.pr[i].h++;sfx('build');if(!cp().ai)moneyPop('loss','Construcție',T[i].n,T[i].h,[{k:G.cur,a:-T[i].h}],-1);logm(cp().name+' construiește la '+T[i].n+(G.pr[i].h===5?' un hotel.':' (case: '+G.pr[i].h+').'));}
function doSell(i){if(!canSell(i))return;cp().cash+=T[i].h/2;G.pr[i].h--;if(!cp().ai){sfx('earn');moneyPop('gain','Vânzare clădire',T[i].n,T[i].h/2,[{k:G.cur,a:T[i].h/2}],-1);}logm(cp().name+' vinde o clădire la '+T[i].n+'.');}
function doMort(i){if(!canMort(i))return;G.pr[i].m=true;cp().cash+=T[i].p/2;if(!cp().ai){sfx('earn');moneyPop('gain','Ipotecă',T[i].n,T[i].p/2,[{k:G.cur,a:T[i].p/2}],-1);}logm(cp().name+' ipotechează '+T[i].n+'.');}
function doUnmort(i){if(!canUnmort(i))return;cp().cash-=unCost(i);G.pr[i].m=false;if(!cp().ai){sfx('pay');moneyPop('loss','Răscumpărare',T[i].n,unCost(i),[{k:G.cur,a:-unCost(i)}],-1);}logm(cp().name+' răscumpără '+T[i].n+'.');}

/* ---------- fluxul jocului ---------- */
function pay(pi,to,amt){
  var p=G.pl[pi];
  if(p.cash>=amt){p.cash-=amt;if(to!==null)G.pl[to].cash+=amt;sfx(to!==null?'earn':'pay',lastRoll&&Date.now()-lastRoll<400?ld:0);return true;}
  G.debt={pi:pi,to:to,amt:amt};G.phase='debt';
  logm(p.name+' are de plătit '+amt+' lei și îi lipsesc bani.');
  return false;
}
function fin(){
  if(G.phase==='buy'||G.phase==='debt')return;
  G.phase=(G.dbl>0&&!cp().jail)?'roll':'end';
}
function move(n){
  var p=cp();ld=0.85+Math.min(n,12)*(STEP/1000);
  if(p.pos+n>=40){p.cash+=200;logm(p.name+' trece pe la Start: +200 lei.');sfx('start',Math.max(0.5,ld-0.3));moneyPop('gain','Start','Trecere pe Start',200,[{k:G.cur,a:200}],Math.max(0,landMs()-300));}
  p.pos=(p.pos+n)%40;
}
function goJail(){sfx('jail',lastRoll&&Date.now()-lastRoll<400?ld:0);var p=cp();p.pos=10;p.jail=1;p.jt=0;G.dbl=0;logm(p.name+' ajunge în închisoare.');}
function repairCost(a,b){
  var c=0;
  owned(G.cur).forEach(function(i){var s=G.pr[i];if(s.h===5)c+=b;else c+=s.h*a;});
  return c;
}
function drawCard(kind){
  var list=kind==='chance'?CH:CF,ord=G.dk[kind];
  var c=list[ord[G.dp[kind]%ord.length]];G.dp[kind]++;
  var p=cp();
  logm(p.name+' trage o carte: '+c.x);sfx('card',ld);
  (function(x,pi0){schedulePop(landMs(),function(){showCard(kind,x,pi0);},CARDMS);})(c.x,G.cur);
  var dn=kind==='chance'?'Șansă':'Cufăr';
  var others=G.pl.filter(function(q,k){return k!==G.cur&&!q.dead;});
  switch(c.k){
    case 'gain':
      if(c.v>=0){p.cash+=c.v;moneyPop('gain',dn,'Câștig',c.v,[{k:G.cur,a:c.v}],landMs()+400);sfx('earn',ld+0.4);return false;}
      if(pay(G.cur,null,-c.v)){moneyPop('loss',dn,'Cheltuială',-c.v,[{k:G.cur,a:c.v}],landMs()+400);return false;}
      G.debt.label=dn;return true;
    case 'to':
      move((c.v-p.pos+40)%40);land();return true;
    case 'back':
      p.pos=(p.pos+37)%40;land();return true;
    case 'jail':
      goJail();return false;
    case 'collect':
      var tot=0;others.forEach(function(o){var m=Math.min(o.cash,c.v);o.cash-=m;p.cash+=m;tot+=m;});
      if(tot>0){moneyPop('gain',dn,'Zi de naștere',tot,[{k:G.cur,a:tot}],landMs()+400);sfx('earn',ld+0.4);}
      return false;
    case 'split':
      var total=c.v*others.length;
      if(p.cash>=total){p.cash-=total;others.forEach(function(o){o.cash+=c.v;});moneyPop('loss',dn,'Plată către jucători',total,[{k:G.cur,a:-total}],landMs()+400);return false;}
      G.debt={pi:G.cur,to:null,amt:total,split:c.v,label:'Plată către jucători'};G.phase='debt';return true;
    case 'repair':
      var cost=repairCost(c.a,c.b);
      if(cost===0)return false;
      if(pay(G.cur,null,cost)){moneyPop('loss',dn,'Reparații',cost,[{k:G.cur,a:-cost}],landMs()+400);return false;}
      G.debt.label='Reparații';return true;
  }
  return false;
}
function land(){
  var p=cp(),i=p.pos,t=T[i],s=G.pr[i];
  switch(t.t){
    case 'p':case 'st':case 'ut':
      if(!s){
        if(p.cash>=t.p){G.phase='buy';return;}
        logm(p.name+' nu are destui bani pentru '+t.n+' ('+t.p+' lei).');
      }else if(s.o!==G.cur&&!s.m){
        var r=rentOf(i);
        logm(p.name+' plătește chirie '+r+' lei lui '+G.pl[s.o].name+'.');
        if(!pay(G.cur,s.o,r)){G.debt.tile=i;return;}
        rentPop(i,G.cur,s.o,r);
      }
      break;
    case 'tax':
      logm(p.name+' plătește '+t.n.toLowerCase()+': '+t.a+' lei.');
      if(!pay(G.cur,null,t.a)){G.debt.label=t.n;return;}
      moneyPop('loss','Taxă',t.n,t.a,[{k:G.cur,a:-t.a}],landMs());
      break;
    case 'chance':case 'chest':
      if(drawCard(t.t))return;
      break;
    case 'gojail':
      goJail();break;
  }
  fin();
}
function roll(){
  var p=cp(),a=rd(),b=rd();
  G.dice=[a,b];G.fresh=true;lastRoll=Date.now();ld=0.85;sfx('roll');
  if(p.jail){
    if(a===b){
      p.jail=0;p.jt=0;G.dbl=0;
      logm(p.name+' dă dubluri ('+a+'-'+b+') și iese din închisoare.');
      move(a+b);land();return;
    }
    p.jt++;
    if(p.jt>=3){
      logm(p.name+' aruncă '+a+'-'+b+', plătește 50 lei și iese din închisoare.');
      p.jail=0;p.jt=0;
      if(pay(G.cur,null,50)){moneyPop('loss','Închisoare','Cauțiune',50,[{k:G.cur,a:-50}],0);move(a+b);land();}else G.debt.label='Cauțiune';
      return;
    }
    logm(p.name+' aruncă '+a+'-'+b+' și rămâne în închisoare ('+p.jt+'/3).');
    G.phase='end';return;
  }
  if(a===b){
    G.dbl++;
    if(G.dbl>=3){logm(p.name+' dă dubluri a treia oară la rând.');goJail();G.phase='end';return;}
  }else G.dbl=0;
  move(a+b);
  logm(p.name+' aruncă '+a+'+'+b+' și ajunge la '+T[p.pos].n+(a===b?' (dubluri)':'')+'.');
  land();
}
function payJail(){var p=cp();if(p.cash<50)return;p.cash-=50;p.jail=0;p.jt=0;logm(p.name+' plătește 50 lei și iese din închisoare.');sfx('pay');moneyPop('loss','Închisoare','Cauțiune',50,[{k:G.cur,a:-50}],0);}
function buy(){
  var p=cp(),t=T[p.pos];
  if(G.phase!=='buy'||p.cash<t.p)return;
  p.cash-=t.p;G.pr[p.pos]={o:G.cur,h:0,m:false};sfx('buy');(function(i0,c0){schedulePop(0,function(){showBuy(i0,c0);});})(p.pos,G.cur);
  logm(p.name+' cumpără '+t.n+' cu '+t.p+' lei.');
  G.phase='x';fin();
}
function skip(){if(G.phase!=='buy')return;logm(cp().name+' nu cumpără '+T[cp().pos].n+'.');G.phase='x';fin();}
function payDebt(){
  var d=G.debt,p=G.pl[d.pi];
  if(!d||p.cash<d.amt)return;
  p.cash-=d.amt;
  if(d.split){G.pl.forEach(function(o,k){if(k!==d.pi&&!o.dead)o.cash+=d.split;});}
  else if(d.to!==null)G.pl[d.to].cash+=d.amt;
  logm(p.name+' își achită datoria de '+d.amt+' lei.');
  G.debt=null;G.phase='x';
  if(d.tile!==undefined&&d.to!==null){sfx('earn');rentPop(d.tile,d.pi,d.to,d.amt);}
  else{sfx('pay');moneyPop('loss','Datorie achitată',d.label||'',d.amt,[{k:d.pi,a:-d.amt}],0);}
  fin();
}
function bankrupt(){
  var d=G.debt,p=cp();
  var to=(d&&d.to!==null&&d.to!==undefined)?d.to:null;
  logm(p.name+' a dat faliment.');sfx('bank');showBankrupt(G.cur);
  if(to!==null)G.pl[to].cash+=p.cash;
  p.cash=0;p.dead=true;
  Object.keys(G.pr).forEach(function(k){
    var s=G.pr[k];
    if(s.o===G.cur){if(to!==null){s.o=to;s.h=0;}else delete G.pr[k];}
  });
  G.debt=null;
  var alive=G.pl.filter(function(x){return !x.dead;});
  if(alive.length<=1){
    G.over=G.pl.indexOf(alive[0]);G.phase='over';G.sheet={t:'over'};
    logm(alive[0].name+' a câștigat jocul.');sfx('win');return;
  }
  nextTurn();
}
function nextTurn(){
  var n=G.cur;
  do{n=(n+1)%G.pl.length;}while(G.pl[n].dead);
  G.cur=n;G.dbl=0;G.phase='roll';G.debt=null;G.sheet=null;railPl=null;G.turns=(G.turns||0)+1;G.tk=(G.tk||0)+1;if(Date.now()>bkUntil)clearPop();popFree=0;
  if(G.turns>=400){endByWealth();return;}
  logm('Rândul lui '+G.pl[n].name+'.');
}
function endTurn(){if(G.phase!=='end')return;nextTurn();}
function worth(pi){
  var w=G.pl[pi].cash;
  owned(pi).forEach(function(i){var s=G.pr[i],t=T[i];w+=s.m?t.p/2:t.p;if(t.t==='p')w+=s.h*t.h;});
  return w;
}
function endByWealth(){
  var best=-1,bi=0;
  G.pl.forEach(function(q,k){if(q.dead)return;var w=worth(k);if(w>best){best=w;bi=k;}});
  G.over=bi;G.byWealth=best;G.phase='over';G.sheet={t:'over'};
  sfx('win');logm('Partida s-a încheiat. Cea mai mare avere: '+G.pl[bi].name+' ('+best+' lei).');
}

/* ---------- jucătorul calculator ---------- */
function aiManage(){
  var p=cp(),guard=0,i;
  owned(G.cur).forEach(function(j){if(G.pr[j].m&&p.cash>T[j].p*0.55+450)doUnmort(j);});
  while(guard++<10){
    var c=owned(G.cur).filter(function(j){return canBuild(j)&&p.cash-T[j].h>=250;});
    if(!c.length)break;
    doBuild(c[0]);
  }
}
function aiRaise(){
  var p=cp(),guard=0;
  while(p.cash<G.debt.amt&&guard++<80){
    var o=owned(G.cur),h=o.filter(canSell)[0];
    if(h!==undefined){doSell(h);continue;}
    var m=o.filter(canMort).sort(function(a,b){return T[a].p-T[b].p;})[0];
    if(m!==undefined){doMort(m);continue;}
    break;
  }
}
function aiStep(){
  timer=null;
  if(screen!=='game'||!G||G.over!==null)return;
  var p=cp();if(!p.ai)return;MP.act=true;
  switch(G.phase){
    case 'roll':
      aiManage();
      if(p.jail&&p.cash>300)payJail();else roll();
      break;
    case 'buy':
      var t=T[p.pos];
      var full=t.g&&grp(t.g).every(function(j){return j===p.pos||(G.pr[j]&&G.pr[j].o===G.cur);});
      if(p.cash-t.p>=100||full)buy();else skip();
      break;
    case 'debt':
      aiRaise();
      if(p.cash>=G.debt.amt)payDebt();else bankrupt();
      break;
    case 'end':
      aiManage();endTurn();break;
  }
  render();
}
function schedule(){
  if(timer){clearTimeout(timer);timer=null;}
  if(screen==='game'&&G&&G.over===null&&cp().ai&&G.started!==false&&(!MP.on||MP.host)){var dl=G.phase==='roll'?900:650;dl=Math.max(dl,lastRoll+1500-Date.now(),busyUntil-Date.now());timer=setTimeout(aiStep,dl);}
}

/* ---------- salvare ---------- */
function save(){if(MP.on){mpPush();return;}try{if(G&&screen==='game')localStorage.setItem(KEY,JSON.stringify({G:G}));}catch(e){}}
function loadSave(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.G&&s.G.over===null&&s.G.pl&&s.G.pr)return s.G;}catch(e){}
  return null;
}
function clearSave(){try{localStorage.removeItem(KEY);}catch(e){}}

function newGame(){
  var pl=[];
  for(var i=0;i<setup.n;i++){
    pl.push({name:(setup.names[i]||'').trim()||('Jucător '+(i+1)),ai:setup.t[i]==='ai',cash:1500,pos:0,jail:0,jt:0,dead:false});
  }
  G={pl:pl,pr:{},cur:0,phase:'roll',dice:[3,4],dbl:0,debt:null,log:['Joc nou. '+pl[0].name+' începe.'],sheet:null,over:null,fresh:false,turns:0,
     dk:{chance:shuffle(CH.map(function(_,i){return i;})),chest:shuffle(CF.map(function(_,i){return i;}))},dp:{chance:0,chest:0},started:!MP.on,hostId:MP.on?MP.id:null};
  screen='game';shown=null;railOpen=false;railPl=null;railWas=false;render();
}

/* ---------- afișare ---------- */
function money(n){return n+' lei';}
function cellRC(i){
  var r,c;
  if(i<=10){r=11;c=11-i;}
  else if(i<=20){c=1;r=11-(i-10);}
  else if(i<=30){r=1;c=1+(i-20);}
  else{c=11;r=1+(i-30);}
  return [r,c];
}
function cellPos(i){var rc=cellRC(i);return 'grid-row:'+rc[0]+';grid-column:'+rc[1];}
function initial(n){return String(n).trim().charAt(0).toUpperCase()||'?';}
function label(n){n=String(n).trim();return n.length>6?n.slice(0,5)+'…':n;}
function drawPawns(){
  if(!app.querySelector)return;
  var box=app.querySelector('#pawns');if(!box)return;
  var h='';
  G.pl.forEach(function(q,k){
    if(q.dead)return;
    h+='<div class="pw'+(k===G.cur&&G.over===null?' act':'')+'" data-k="'+k+'" style="--c:var(--p'+k+')"><span>'+esc(label(q.name))+'</span></div>';
  });
  box.innerHTML=h;placeAll();
}
function placeAll(){
  if(!app.querySelector||!G||!shown)return;
  var cnt={};
  G.pl.forEach(function(q,k){
    if(q.dead)return;
    var el=app.querySelector('.pw[data-k="'+k+'"]');if(!el)return;
    var i=shown[k],j=cnt[i]||0;cnt[i]=j+1;
    var rc=cellRC(i);
    el.style.left=((rc[1]-1)/11*100)+'%';el.style.top=((rc[0]-1)/11*100)+'%';
    el.style.setProperty('--oy',(j*10)+'px');
  });
}
function planWalk(){
  var need=0;
  G.pl.forEach(function(q,k){
    if(q.dead){shown[k]=q.pos;return;}
    var d=(q.pos-shown[k]+40)%40;
    if(d===0)return;
    need=Math.max(need,d<=12?d:1);
  });
  if(!need)return;
  var start=Math.max(Date.now(),lastRoll+800);
  busyUntil=Math.max(busyUntil,start+need*STEP+450);
  if(!walkT)walkT=setTimeout(walkTick,Math.max(0,start-Date.now()));

function walkTick(){
  walkT=null;
  if(screen!=='game'||!G||!shown)return;
  var more=false,stepped=false;
  G.pl.forEach(function(q,k){
    if(q.dead)return;
    var d=(q.pos-shown[k]+40)%40;
    if(d===0)return;
    var el=app.querySelector?app.querySelector('.pw[data-k="'+k+'"]'):null;
    if(d<=12){
      shown[k]=(shown[k]+1)%40;more=more||d>1;stepped=true;
      if(el&&el.firstChild&&el.firstChild.animate){
        try{el.firstChild.animate([{transform:'translateY(0) scale(1)'},{transform:'translateY(-8px) scale(1.15)'},{transform:'translateY(0) scale(1)'}],{duration:STEP});}catch(e){}
      }
    }else{
      shown[k]=q.pos;
      if(el){el.classList.add('jump');setTimeout(function(){el.classList.remove('jump');},520);}
    }
  });
  placeAll();
  if(stepped)sfx('step');
  if(more)walkT=setTimeout(walkTick,STEP);
}

function goRail(){try{var r=app.querySelector('.rail');if(r&&innerWidth<880)r.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}}
function act(a,i){
  if(screen==='setup'){
    if(a==='setn'){setup.n=i;}
    else if(a==='settype'){setup.t[i]=setup.t[i]==='h'?'ai':'h';}
    else if(a==='mpcreate'){mpStart(true,rcode());return;}
    else if(a==='mpjoin'){if(mpCode.length===4)mpStart(false,mpCode);return;}
    else if(a==='start'){clearSave();saved=null;newGame();return;}
    else if(a==='resume'){if(saved){G=saved;G.sheet=null;screen='game';shown=null;railOpen=false;railPl=null;railWas=false;}}
    render();return;
  }
  if(!G)return;
  if(a==='copy'){try{navigator.clipboard.writeText(MP.code);}catch(e){}mpMsg='Cod copiat: '+MP.code;render();return;}
  if(a==='savename'){var ni=document.getElementById('myname');if(ni)mpName(ni.value);return;}
  if(a==='mpbegin'){if(MP.host&&G.started===false){G.started=true;MP.act=true;mpMsg='';render();}return;}
  if(a==='tile'){G.sheet={t:'tile',i:i};render();return;}
  if(a==='menu'){G.sheet={t:'menu'};render();return;}
  if(a==='mute'){muted=!muted;try{localStorage.setItem('cartiere-mute',muted?'1':'0');}catch(e){}if(!muted)sfx('on');render();return;}
  if(a==='close'){G.sheet=null;render();return;}
  if(a==='rail'){railOpen=!railOpen;render();goRail();return;}
  if(a==='railclose'){railOpen=false;render();return;}
  if(a==='rview'){railPl=i;render();return;}
  if(a==='rpl'){railPl=i;railOpen=true;render();goRail();return;}
  if(a==='newgame'){mpFree();mpLeave();mpMsg='';clearPop();clearSave();saved=null;shown=null;railOpen=false;railPl=null;railWas=false;screen='setup';if(timer){clearTimeout(timer);timer=null;}G=null;render();return;}
  if(G.over!==null)return;
  if(a==='wealth'){endByWealth();MP.act=true;render();return;}
  if(cp().ai||!mine())return;
  MP.act=true;
  switch(a){
    case 'roll':if(G.phase==='roll')roll();break;
    case 'jailpay':if(G.phase==='roll'&&cp().jail)payJail();break;
    case 'buy':buy();break;
    case 'skip':skip();break;
    case 'paydebt':if(G.phase==='debt')payDebt();break;
    case 'bankrupt':if(G.phase==='debt')bankrupt();break;
    case 'end':endTurn();break;
    case 'build':doBuild(i);break;
    case 'sell':doSell(i);break;
    case 'mort':doMort(i);break;
    case 'unmort':doUnmort(i);break;
  }
  render();
}
app.addEventListener('click',function(e){
  if(e.target.classList&&e.target.classList.contains('rail-bg')){railOpen=false;render();return;}
  if(e.target.classList&&e.target.classList.contains('sheet-bg')){if(G){G.sheet=(G.over!==null)?G.sheet:null;render();}return;}
  var b=e.target.closest('[data-a]');
  if(!b||b.disabled)return;
  act(b.getAttribute('data-a'),parseInt(b.getAttribute('data-i'),10));
});
app.addEventListener('input',function(e){
  var el=e.target;if(el.id==='mpcode')mpCode=el.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(el.id&&el.id.indexOf('pn')===0)setup.names[parseInt(el.getAttribute('data-i'),10)]=el.value;
});


/* ---------- multiplayer (db + room din runtime-ul paginii publicate) ---------- */
var MP={on:false,code:'',id:null,seats:{},names:{},host:false,db:null,room:null,n:0,rs:0,act:false,claimed:false,off:[]},remotePop=false,mpCode='',mpMsg='';
function rcode(){var a='ABCDEFGHJKMNPQRSTUVWXYZ23456789',r='';for(var i=0;i<4;i++)r+=a.charAt(Math.floor(Math.random()*a.length));return r;}
function mine(){return !MP.on||MP.seats[G.cur]===MP.id;}
function mpEmit(t,d){try{if(MP.room)MP.room.emit(t,d);}catch(e){}}
function clean(h){var t=document.createElement('template');t.innerHTML=h;t.content.querySelectorAll('script,iframe,object,embed,link,style').forEach(function(x){x.remove();});t.content.querySelectorAll('*').forEach(function(x){[].slice.call(x.attributes).forEach(function(a){if(/^on/i.test(a.name)||/javascript:/i.test(a.value))x.removeAttribute(a.name);});});return t.innerHTML;}
function mpPush(){
  if(!MP.on||!MP.act||!G||!MP.db)return;MP.act=false;
  var c=JSON.parse(JSON.stringify(G));c.sheet=null;c.fresh=false;c.rs=lastRoll;MP.n++;
  MP.db.doc('games/'+MP.code).set({g:JSON.stringify(c),by:MP.id,n:MP.n,t:Date.now()}).catch(function(){mpMsg='Sincronizare eșuată.';});
}
function applyNames(){if(G)G.pl.forEach(function(q,k){if(MP.names[k])q.name=MP.names[k];});}
function mySeat(){for(var k in MP.seats)if(MP.seats[k]===MP.id)return +k;return -1;}
function mpName(v){v=String(v||'').trim().slice(0,14);var k=mySeat();if(!v||k<0||!MP.db)return;MP.names[k]=v;MP.db.doc('games/'+MP.code+'/seats/'+k).set({id:MP.id,name:v}).catch(function(){});applyNames();mpMsg='Nume salvat: '+v;if(G&&G.started===false)MP.act=MP.host;render();}
function claim(){
  if(!G||!MP.on||MP.claimed||!MP.sl)return;
  for(var k in MP.seats)if(MP.seats[k]===MP.id){MP.claimed=true;return;}
  for(var i=0;i<G.pl.length;i++)if(!G.pl[i].ai&&!MP.seats[i]){MP.claimed=true;MP.seats[i]=MP.id;MP.db.doc('games/'+MP.code+'/seats/'+i).set({id:MP.id}).catch(function(){});return;}
}
function mpApply(d){
  if(!d||d.by===MP.id||!d.g)return;
  var g;try{g=JSON.parse(d.g);}catch(e){return;}
  var pc=G?G.cur:-1,sh=G&&G.sheet;
  var nr=g.rs&&g.rs!==MP.rs;MP.rs=g.rs;
  G=g;if(G.hostId)MP.host=G.hostId===MP.id;G.sheet=sh||null;if(G.over!==null&&!G.sheet)G.sheet={t:'over'};
  if(nr){G.fresh=true;lastRoll=Date.now();ld=0.85;sfx('roll');}
  if(pc!==G.cur&&Date.now()>bkUntil)clearPop();
  screen='game';if(!shown||shown.length!==G.pl.length)shown=G.pl.map(function(q){return q.pos;});
  applyNames();claim();render();
}
async function mpStart(create,code){
  mpMsg='Se conectează…';render();
  try{
    if(typeof claude==='undefined')throw 0;
    var db=await claude.use('db'),u=await claude.use('user'),r=await claude.use('room');
    if(!db||!u)throw 0;
    MP.db=db;MP.id=await u.id();MP.room=r;if(!MP.id)throw 0;
  }catch(e){mpMsg='Nu mă pot conecta la server. Încearcă din nou în câteva secunde.';render();return;}
  mpLeave();
  MP.code=code;MP.on=true;MP.host=create;MP.claimed=false;MP.seats={};MP.names={};MP.n=0;MP.rs=0;
  if(MP.room){MP.room.presence({uid:MP.id});MP.off.push(MP.room.on('sfx',function(m){var d=m.data;if(!d||m.isMe||d.c!==MP.code||typeof d.name!=='string')return;remoteSfx=true;sfx(d.name,+d.d||0);remoteSfx=false;}));}
  MP.gone={};MP.sl=false;var iv=setInterval(mpSweep,3000);MP.off.push(function(){clearInterval(iv);});
  if(MP.room)MP.off.push(MP.room.on('pop',function(m){
    var d=m.data;if(!d||m.isMe||d.c!==MP.code||typeof d.html!=='string'||!G)return;
    remotePop=true;try{popOpen(clean(d.html),d.vib,d.dur);}catch(e){}remotePop=false;
  }));
  MP.off.push(MP.db.collection('games/'+code+'/seats').onSnapshot(function(q){
    q.docChanges().forEach(function(c){if(c.type==='removed'){var id=c.doc.id;if(MP.seats[id]===MP.id)MP.claimed=false;delete MP.seats[id];delete MP.names[id];}});MP.sl=true;
    q.docs.forEach(function(x){var v=x.data();if(v){MP.seats[x.id]=v.id;if(v.name)MP.names[x.id]=v.name;}});applyNames();claim();if(G&&screen==='game')render();
  }));
  MP.off.push(MP.db.doc('games/'+code).onSnapshot(function(s){if(s.exists)mpApply(s.data());}));
  if(create){MP.act=true;mpMsg='';newGame();}
  else{mpMsg='Aștept camera '+code+'…';setTimeout(function(){if(MP.on&&MP.code===code&&!G){mpMsg='Nu găsesc camera '+code+'. Verifică codul sau cere gazdei să creeze camera.';render();}},6000);}
  render();
}
function mpSweep(){
  if(!MP.on||!G||!MP.room||!MP.room.peers||!MP.sl)return;
  var now=Date.now(),conn={},ch=false;conn[MP.id]=1;
  try{MP.room.peers().forEach(function(p){var u=p.presence&&p.presence.uid;if(u)conn[u]=1;});}catch(e){return;}
  function gone(u){if(conn[u]){delete MP.gone[u];return false;}if(!MP.gone[u])MP.gone[u]=now;return now-MP.gone[u]>8000;}
  if(G.hostId&&G.hostId!==MP.id&&gone(G.hostId)){
    var cand=-1,k;
    for(k=0;k<G.pl.length&&cand<0;k++){var u=MP.seats[k];if(u&&u!==G.hostId&&conn[u]&&(!G.pl[k].ai||G.pl[k].bot))cand=k;}
    if(cand>=0&&MP.seats[cand]===MP.id){G.hostId=MP.id;MP.host=true;ch=true;logm(G.pl[cand].name+' preia gazda camerei.');}
  }
  if(MP.host){
    G.pl.forEach(function(q,k){
      var u=MP.seats[k];if(!u||q.dead||(q.ai&&!q.bot))return;
      var g=gone(u);
      if(G.started===false){if(g&&u!==MP.id){delete MP.seats[k];delete MP.names[k];MP.db.doc('games/'+MP.code+'/seats/'+k).delete().catch(function(){});ch=true;}}
      else if(g&&!q.bot){q.ai=true;q.bot=true;ch=true;logm(q.name+' a ieșit: joacă un bot până revine.');}
      else if(!g&&q.bot){q.ai=false;q.bot=false;ch=true;logm(q.name+' a revenit în joc.');}
    });
  }
  if(ch){MP.act=true;render();}
}
function mpFree(){var k=mySeat();if(k>=0&&MP.db&&G&&G.started===false)MP.db.doc('games/'+MP.code+'/seats/'+k).delete().catch(function(){});}
function mpLeave(){MP.off.forEach(function(f){try{f();}catch(e){}});MP.off=[];MP.on=false;MP.act=false;MP.seats={};}

saved=loadSave();
render();

if(typeof globalThis!=='undefined'&&globalThis.__CARTIERE_TEST){
  globalThis.__t={setup:setup,newGame:newGame,aiStep:aiStep,getG:function(){return G;},T:T};
}
})();
